name: Build iOS IPA

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List files (DEBUG)
      run: ls -la
    
    - name: Find Xcode project (DEBUG)
      run: find . -name "*.xcodeproj" -o -name "*.xcworkspace"
    
    - name: Build unsigned IPA
      run: |
        xcodebuild -list
        xcodebuild archive \
          -project LiquidGlassKit015.xcodeproj \
          -scheme LiquidGlassKit015 \
          -archivePath build/App.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -verbose
    
    - name: Create IPA
      if: success()
      run: |
        mkdir -p Payload
        cp -r build/App.xcarchive/Products/Applications/* Payload/
        zip -r app.ipa Payload
    
    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app.ipa
        path: app.ipa
